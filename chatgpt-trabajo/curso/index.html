<script>
const modules=[
{
t:"ChatGPT como asistente de trabajo",i:"01",
intro:"El objetivo de este curso no es aprender a hablar con una IA por curiosidad. Es aprender a darle trabajo de forma clara para que te ayude a producir, revisar, ordenar y pensar más rápido.",
objective:"Al terminar este módulo sabrás convertir una tarea vaga en una instrucción útil y reutilizable.",
sections:[
["1. Dejar de pedir «cosas» y empezar a encargar tareas","ChatGPT responde mejor cuando entiende qué estás intentando conseguir. «Hazme un email» deja demasiadas decisiones abiertas: ¿para quién?, ¿con qué tono?, ¿con qué objetivo?, ¿qué información puede modificar?",""],
["2. Las 4 piezas de una buena petición","Usa esta estructura mental: <b>Contexto</b> (qué está pasando) + <b>Tarea</b> (qué quieres que haga) + <b>Formato</b> (cómo quieres recibirlo) + <b>Criterios</b> (qué debe respetar). No hace falta escribir las cuatro siempre, pero son un excelente punto de partida.",""],
["3. Trabajar por iteraciones","No intentes acertar a la primera. Un flujo profesional suele ser: primera versión → detectar qué no te gusta → dar instrucciones concretas → revisar → versión final. Puedes decir «hazlo más breve», «dame tres alternativas» o «mantén exactamente los datos».",""]
],
example:["ANTES","Hazme un email para un cliente.","DESPUÉS","Trabajo en una pequeña empresa. Un pedido se retrasará dos días por un problema logístico. Redacta un email para el cliente. Tono profesional, cercano y transparente. Máximo 130 palabras. No culpes a terceros ni inventes información."],
prompt:"Actúa como mi asistente de trabajo.
Contexto: [qué está pasando]
Objetivo: [qué necesito conseguir]
Tarea: [qué quieres que hagas]
Formato: [email / tabla / lista / esquema / etc.]
Criterios: [tono, extensión, restricciones, información que no debe inventar]",
tip:"La calidad de la respuesta depende mucho más de la claridad del encargo que de utilizar palabras «mágicas» en el prompt.",
q:"¿Qué combinación describe mejor una petición de trabajo útil?",opts:["Contexto + tarea + formato + criterios","Una pregunta de una sola palabra","Pedir siempre una respuesta muy larga"],a:0
},
{
t:"Emails y mensajes profesionales",i:"02",
intro:"Una tarea aparentemente pequeña puede consumir mucho tiempo: encontrar el tono adecuado, ordenar las ideas y revisar que no suene brusco. ChatGPT puede ayudarte en las tres fases.",
objective:"Aprenderás a redactar desde cero, mejorar borradores y adaptar un mismo mensaje a distintos destinatarios.",
sections:[
["1. Redactar desde los hechos","Dale a ChatGPT la información real y deja claro qué no puede inventar. Después decide tú si el resultado refleja lo que quieres comunicar.",""],
["2. Mejorar sin cambiar el significado","Una instrucción importante es: «mantén exactamente la información». Así puedes pedir que mejore claridad, estructura, tono o concisión sin autorizar cambios de contenido.",""],
["3. Adaptar el mismo mensaje","Puedes pedir una versión formal, otra cercana, una versión corta para Teams/Slack o un asunto de email. El contenido base puede ser el mismo.",""]
],
example:["BORRADOR","Hola Marta, al final no podremos tener lo de la semana que viene. Ya te avisaré.","VERSIÓN PROFESIONAL","Hola Marta,

Quería avisarte de que finalmente no podremos tener preparado el material para la próxima semana. Estamos reorganizando los plazos y te confirmaré la nueva fecha en cuanto la tengamos.

Disculpa las molestias y gracias por la comprensión."],
prompt:"Reescribe este mensaje para que sea profesional, claro y cordial.
Destinatario: [cliente / compañero / responsable]
Objetivo: [qué quiero conseguir]
Tono: [formal / cercano / diplomático]
Límite: [palabras o líneas]
Mantén exactamente los hechos y no inventes información.

Texto:
[pega aquí tu borrador]",
tip:"Antes de enviar, comprueba siempre destinatario, fechas, cantidades, nombres y compromisos. La IA puede mejorar el estilo y aun así equivocarse en un dato.",
q:"¿Qué instrucción ayuda a evitar que una reescritura cambie el contenido?",opts:["«Mantén exactamente los hechos y no inventes información»","«Hazlo más impresionante»","«Añade detalles para que parezca más profesional»"],a:0
},
{
t:"Crear y mejorar documentos",i:"03",
intro:"Los documentos largos se vuelven mucho más manejables si separas planificación, redacción y revisión. ChatGPT puede participar en cada etapa.",
objective:"Aprenderás a pasar de ideas desordenadas a una estructura y de una estructura a un documento revisable.",
sections:[
["1. Empieza por el índice","Para un informe, propuesta o procedimiento importante, pide primero una estructura. Es más barato corregir un índice que rehacer cinco páginas.",""],
["2. Redacta por bloques","Trabaja sección por sección. Puedes proporcionar el contenido de cada apartado y pedir que mantenga el mismo estilo en todo el documento.",""],
["3. Usa la IA como revisor","Además de escribir, puede buscar frases ambiguas, repeticiones, contradicciones, títulos poco claros o información que falta.",""]
],
prompt:"Crea una estructura para un documento sobre [tema].
Público: [quién lo leerá]
Objetivo: [qué debe conseguir]
Extensión aproximada: [x páginas / x palabras]
Incluye:
- secciones y subsecciones
- objetivo de cada sección
- información que debería aportar
- preguntas que necesito resolver antes de redactar",
tip:"Para documentos importantes, conserva siempre una versión humana revisada. No confundas «texto bien escrito» con «texto correcto».",
q:"¿Por qué conviene crear primero una estructura?",opts:["Porque permite corregir el enfoque antes de redactar todo","Porque así no hace falta revisar el documento","Porque ChatGPT puede decidir por nosotros qué información es verdadera"],a:0
},
{
t:"Resumir reuniones, textos y documentos",i:"04",
intro:"Un buen resumen no es simplemente un texto más corto. Tiene que conservar lo importante para la decisión que vas a tomar después.",
objective:"Aprenderás a convertir información extensa en decisiones, acciones, responsables y próximos pasos.",
sections:[
["1. Define para qué necesitas el resumen","Un director puede necesitar cinco conclusiones. Un compañero que no estuvo en la reunión puede necesitar contexto y tareas. El formato depende del uso.",""],
["2. Extrae acciones","En reuniones, pide separar decisiones tomadas, tareas, responsables, fechas y asuntos pendientes. Si algo no aparece en la fuente, debe quedar como «no indicado».",""],
["3. Resume sin inventar","Añade una restricción explícita: «si la información no está en el texto, indícalo». Esto reduce el riesgo de convertir una inferencia en un hecho.",""]
],
prompt:"Resume el contenido siguiente para una persona que no estuvo presente.
Separa claramente:
1. Decisiones tomadas
2. Tareas pendientes
3. Responsable de cada tarea, si aparece
4. Fechas o plazos, si aparecen
5. Dudas y asuntos pendientes

No inventes información. Si un dato no aparece, escribe «no indicado».

Contenido:
[pega aquí el texto]",
example:["RESUMEN FLOJO","La reunión trató varios temas y se acordaron algunas acciones.","RESUMEN ÚTIL","DECISIONES: Se mantiene la fecha de lanzamiento.
TAREAS: Preparar materiales de venta.
RESPONSABLE: Laura.
PLAZO: viernes.
PENDIENTE: Confirmar presupuesto."],
tip:"Si el documento original es importante, conserva el enlace o archivo de origen. El resumen es una ayuda para trabajar, no sustituye la fuente.",
q:"¿Qué hace especialmente útil un resumen de reunión?",opts:["Separar decisiones, tareas, responsables y fechas","Hacerlo lo más largo posible","Eliminar detalles como fechas y responsables"],a:0
},
{
t:"Organizar tareas y prioridades",i:"05",
intro:"Cuando tienes veinte pendientes, el problema no suele ser escribirlos: es decidir qué merece atención primero y cómo encajarlo en el tiempo disponible.",
objective:"Aprenderás a convertir una lista caótica en un plan de trabajo realista sin delegar el criterio final en la IA.",
sections:[
["1. Dale restricciones reales","Indica cuánto tiempo tienes, qué tareas tienen fecha límite y qué tareas dependen de otras. Sin esas restricciones, el plan será genérico.",""],
["2. Pide que detecte dependencias","Por ejemplo, no puedes «enviar el informe» antes de «revisar los datos». Hacer visibles estas dependencias evita planes imposibles.",""],
["3. Revisa la prioridad","ChatGPT puede proponer una clasificación, pero la prioridad empresarial depende de contexto que quizá la IA no conozca. Tú validas la decisión.",""]
],
prompt:"Estas son mis tareas:
[lista]

Tengo [X horas] disponibles hoy.
Fechas límite: [fechas]
Restricciones: [reuniones, dependencias, etc.]

Ordénalas por impacto y urgencia. Identifica dependencias. Propón bloques de trabajo realistas y explica qué dejarías para después y por qué.",
tip:"No necesitas hacer todo hoy. Una buena planificación también decide qué NO hacer todavía.",
q:"¿Quién debe validar la prioridad final de las tareas?",opts:["La persona responsable, usando el contexto real del trabajo","ChatGPT automáticamente","El orden en que aparezcan las tareas"],a:0
},
{
t:"Preparar reuniones y presentaciones",i:"06",
intro:"La IA es especialmente útil antes de una reunión: puede ayudarte a ordenar objetivos, preparar preguntas, anticipar objeciones y estructurar una presentación.",
objective:"Llegar a una reunión con un propósito claro, preguntas preparadas y próximos pasos definidos.",
sections:[
["1. Define el resultado deseado","Una reunión sin objetivo suele terminar en una conversación larga sin decisión. Pide a ChatGPT que convierta tu objetivo en una agenda concreta.",""],
["2. Anticipa preguntas y objeciones","Pídele que adopte la perspectiva de un cliente, responsable o compañero y que formule preguntas difíciles. Después decide cuáles son relevantes.",""],
["3. Presentaciones: primero el mensaje","Antes de pedir diapositivas, define qué quieres que el público recuerde o decida. Después construye la estructura.",""]
],
prompt:"Voy a reunirme con [persona/equipo] sobre [tema].
Objetivo de la reunión: [objetivo]
Contexto: [información]

Prepárame:
- una agenda de 20-30 minutos
- 7 preguntas importantes
- 5 posibles objeciones y cómo responderlas
- qué información debería llevar preparada
- una propuesta de cierre con próximos pasos",
tip:"No memorices respuestas generadas por IA sin entenderlas. La preparación sirve para pensar mejor, no para sustituir tu criterio.",
q:"¿Qué deberías definir antes de pedir una agenda?",opts:["El objetivo que quieres conseguir","El número exacto de diapositivas","Una respuesta que ChatGPT deba imponer"],a:0
},
{
t:"Analizar información y tomar decisiones",i:"07",
intro:"Comparar opciones es una de las tareas donde ChatGPT puede ayudarte a pensar de forma más estructurada. Pero una tabla bonita no convierte datos incompletos en una decisión correcta.",
objective:"Aprenderás a comparar alternativas, buscar puntos ciegos y separar hechos de interpretaciones.",
sections:[
["1. Define criterios","Antes de comparar, decide qué importa: coste, tiempo, riesgo, calidad, facilidad, impacto o cualquier criterio específico de tu caso.",""],
["2. Pide argumentos en contra","Una técnica útil es pedirle que busque razones por las que tu primera opción podría ser mala. Esto ayuda a detectar sesgos y preguntas pendientes.",""],
["3. Separa hechos e inferencias","Pide que distinga lo que está respaldado por la información de lo que es una interpretación o una hipótesis.",""]
],
prompt:"Compara estas opciones: [A, B, C].
Criterios y peso aproximado: [criterios]
Información disponible: [datos]

Crea una tabla con ventajas, inconvenientes, riesgos y preguntas pendientes.
Separa claramente hechos de interpretaciones.
No inventes datos que no estén proporcionados.
Termina indicando qué información adicional debería conseguir antes de decidir.",
tip:"Para decisiones de alto impacto, la IA debe ser una herramienta de apoyo. Contrasta los datos y consulta a la persona responsable cuando corresponda.",
q:"¿Qué mejora una comparación entre alternativas?",opts:["Definir previamente los criterios de decisión","Pedir que elija una opción sin contexto","Usar únicamente argumentos a favor de nuestra opción favorita"],a:0
},
{
t:"Trabajar con archivos y datos",i:"08",
intro:"Cuando tienes un documento, una tabla o un conjunto de datos, la pregunta importante no es «¿puede ChatGPT leerlo?», sino «¿qué quiero averiguar con él?»",
objective:"Aprenderás a formular preguntas útiles sobre información estructurada y a comprobar las conclusiones.",
sections:[
["1. Empieza por una pregunta","«Analiza este Excel» es demasiado abierto. Define si buscas tendencias, errores, categorías, valores atípicos, comparaciones o una respuesta concreta.",""],
["2. Pide una salida verificable","Las tablas, listas de filas afectadas y explicaciones paso a paso suelen ser más fáciles de revisar que un párrafo genérico.",""],
["3. Protege la información","Antes de cargar archivos de trabajo, revisa las políticas de tu empresa y las condiciones de la herramienta que utilizas. Nunca compartas credenciales ni información que no estés autorizado a compartir.",""]
],
prompt:"Analiza la información proporcionada.
Objetivo: [qué quiero averiguar]

Quiero que:
1. identifiques las tendencias principales;
2. señales valores atípicos o posibles errores;
3. presentes los hallazgos en una tabla;
4. diferencies hechos observados de interpretaciones;
5. indiques qué conclusiones NO pueden extraerse con estos datos.

No inventes datos.",
tip:"Un resultado numérico convincente sigue necesitando comprobación. Especialmente si va a afectar a dinero, clientes, contratos o decisiones.",
q:"¿Qué deberías hacer con una conclusión importante obtenida de un archivo?",opts:["Comprobarla contra los datos y la fuente original","Aceptarla porque la respuesta parece profesional","Eliminar el archivo original"],a:0
},
{
t:"Automatizar tareas repetitivas",i:"09",
intro:"No todo tiene que convertirse en una automatización técnica. Muchas veces el primer gran ahorro consiste en crear una plantilla de IA que puedas reutilizar en segundos.",
objective:"Aprenderás a identificar tareas repetitivas y convertirlas en procesos simples y reutilizables.",
sections:[
["1. Busca patrones","Emails de seguimiento, clasificación de solicitudes, resúmenes semanales, borradores y listas de comprobación suelen repetir una estructura.",""],
["2. Separa lo fijo de lo variable","Una buena plantilla mantiene instrucciones constantes y deja campos para los datos que cambian cada vez.",""],
["3. Prueba antes de confiar","Prueba la plantilla con varios casos, incluidos casos raros. Si falla siempre de la misma manera, mejora las instrucciones.",""]
],
prompt:"Esta tarea se repite con frecuencia:
[tarea]

Proceso actual:
[pasos]

Diseña una plantilla reutilizable para ChatGPT.
Separa:
- instrucciones fijas
- datos que debo proporcionar cada vez
- formato de salida
- comprobaciones que debo hacer antes de usar el resultado
- ejemplos de uso",
tip:"Una plantilla buena reduce trabajo sin eliminar la revisión humana. Si una tarea es sensible, conserva un punto de control antes de enviar o ejecutar el resultado.",
q:"¿Qué caracteriza una buena candidata para una plantilla?",opts:["Una tarea repetitiva con un patrón claro","Una situación que ocurre una sola vez y cambia por completo","Una decisión crítica que nadie revisará"],a:0
},
{
t:"Privacidad, errores y uso responsable",i:"10",
intro:"Saber utilizar ChatGPT profesionalmente incluye saber qué información no debes introducir, qué errores puede cometer y cuándo debes verificar una respuesta.",
objective:"Terminarás este módulo con un conjunto de reglas prácticas para utilizar IA sin bajar tus estándares profesionales.",
sections:[
["1. Protege la información","No introduzcas contraseñas, claves API, datos personales innecesarios, información confidencial o secretos comerciales salvo que exista una base y autorización claras para hacerlo y la herramienta esté aprobada para ese uso.",""],
["2. Las respuestas pueden ser incorrectas","ChatGPT puede inventar datos, fuentes, nombres o explicaciones. Puede hacerlo con un tono totalmente seguro. La seguridad del tono no es una prueba de veracidad.",""],
["3. Aumenta la revisión cuando aumenta el riesgo","Un borrador de email rutinario y una recomendación que afecta a un contrato no requieren el mismo nivel de control. Cuanto mayor sea el impacto, más debes verificar.",""]
],
prompt:"Revisa esta respuesta de IA antes de utilizarla.
Busca específicamente:
- afirmaciones que necesiten verificación
- datos, fechas o nombres posiblemente incorrectos
- supuestos no justificados
- información que falte
- riesgos de privacidad o confidencialidad

No des por cierto ningún dato solo porque aparezca escrito con seguridad.

Respuesta a revisar:
[pega aquí]",
warning:"Regla sencilla: si no estarías dispuesto a enviar una información a una persona externa sin autorización, no la pegues en una herramienta de IA sin comprobar primero que su uso está permitido.",
q:"¿Qué afirmación es correcta?",opts:["Una respuesta convincente puede ser incorrecta y debe verificarse cuando sea relevante","Si ChatGPT responde con seguridad, el dato es fiable","La revisión solo es necesaria cuando la respuesta está mal escrita"],a:0
},
{
t:"Casos prácticos completos",i:"11",
intro:"Ya tienes las piezas. Ahora vamos a combinarlas en flujos reales de trabajo, porque el valor de ChatGPT aparece cuando varias pequeñas ayudas forman un proceso completo.",
objective:"Aprender a diseñar un flujo de trabajo con IA de principio a fin y mantener puntos de revisión humana.",
cases:[
["CASO 1 · CLIENTE","Recibes un email de un cliente con varias peticiones mezcladas.","Paso 1: resume sus necesidades y separa preguntas de peticiones. → Paso 2: identifica qué información te falta. → Paso 3: prepara un borrador de respuesta. → Paso 4: revisa tono, fechas y compromisos. → Paso 5: envía solo después de comprobarlo."],
["CASO 2 · INFORME","Tienes notas, datos y una fecha límite.","Paso 1: pide un índice. → Paso 2: clasifica las notas por sección. → Paso 3: redacta una sección cada vez. → Paso 4: pide una revisión de claridad y contradicciones. → Paso 5: verifica datos y fuentes antes de entregar."],
["CASO 3 · REUNIÓN","Tienes que presentar una propuesta que puede recibir objeciones.","Paso 1: define el objetivo. → Paso 2: crea agenda. → Paso 3: simula preguntas difíciles. → Paso 4: prepara respuestas basadas en datos reales. → Paso 5: después de la reunión, convierte notas en acciones y responsables."]
],
prompt:"Analiza mi proceso de trabajo:

let current=0, completed=new Set();
const menu=document.getElementById("menu"),content=document.getElementById("content"),progress=document.getElementById("progress"),progressText=document.getElementById("progressText");

function renderMenu(){
 menu.innerHTML=modules.map((m,i)=>'<button class="module '+(i===current?'active':'')+'" onclick="show('+i+')"><small>MÓDULO '+m.i+(completed.has(i)?' · ✓ COMPLETADO':'')+'</small>'+m.t+'</button>').join('');
}
function esc(s){return s.replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderSections(m){
 if(m.sections)return m.sections.map(s=>'<div class="lesson"><strong>'+s[0]+'</strong><p>'+s[1]+'</p></div>').join('');
 return m.cases.map(c=>'<div class="lesson"><strong>'+c[0]+'</strong><p>'+c[1]+'</p></div>').join('');
}
function show(i){
 current=i; renderMenu();
 const m=modules[i];
 let html='<div class="tag">MÓDULO '+m.i+' · '+(i===11?'RETO FINAL':'LECCIÓN')+'</div><h2>'+m.t+'</h2><p class="intro">'+m.intro+'</p><div class="objective"><strong>🎯 Objetivo:</strong> '+m.objective+'</div>';
 html+=renderSections(m);
 if(m.example)html+='<div class="example"><div class="label">'+m.example[0]+'</div><div class="body before">'+esc(m.example[1])+'</div><div class="label">'+m.example[2]+'</div><div class="body after">'+esc(m.example[3])+'</div></div>';
 html+='<h3>Prompt listo para usar</h3><div class="prompt"><button class="copy" onclick="copyPrompt(this)">Copiar</button>'+esc(m.prompt)+'</div>';
 if(m.tip)html+='<div class="'+(m.warning?'warning':'tip')+'">💡 <strong>'+ (m.warning?'Importante':'Idea clave')+':</strong> '+m.tip+'</div>';
 if(m.check)html+='<h3>Checklist del reto</h3><div class="checklist">'+m.check.map(x=>'<div class="check">☐ '+x+'</div>').join('')+'</div>';
 html+='<div class="quiz"><div class="quiz-title">🧠 Comprueba lo aprendido</div><p>'+m.q+'</p>'+m.opts.map((x,j)=>'<button class="option" onclick="answer('+j+',this)">'+x+'</button>').join('')+'<div class="result" id="result"></div></div>';
 html+='<div class="nav"><button class="prev" onclick="show('+Math.max(0,i-1)+')">← '+(i?'Anterior':'Inicio')+'</button><button class="next" onclick="show('+Math.min(modules.length-1,i+1)+')">'+(i===modules.length-1?'Volver al reto':'Siguiente →')+'</button></div>';
 if(completed.has(i))html+='<div class="complete">✓ Módulo completado. Puedes volver a él cuando quieras para consultar sus prompts.</div>';
 content.innerHTML=html; window.scrollTo({top:0,behavior:'smooth'}); updateProgress();
}
function answer(j,el){
 const m=modules[current],r=document.getElementById('result');
 document.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));
 if(j===m.a){el.classList.add('correct');r.textContent='✓ Correcto. Has identificado la idea principal.';r.style.color='var(--ok)';completed.add(current);renderMenu();updateProgress()}
 else{el.classList.add('wrong');r.textContent='No exactamente. Revisa el contenido del módulo y vuelve a intentarlo.';r.style.color='var(--warn)'}
}
function updateProgress(){progress.style.width=((current+1)/modules.length*100)+'%';progressText.textContent='Módulo '+(current+1)+' de '+modules.length+(completed.size?' · '+completed.size+' completados':'')}
async function copyPrompt(btn){const text=btn.parentElement.innerText.replace('Copiar','').trim();try{await navigator.clipboard.writeText(text);btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent='Copiar',1400)}catch(e){btn.textContent='Selecciona y copia'}}
show(0);
</script>
