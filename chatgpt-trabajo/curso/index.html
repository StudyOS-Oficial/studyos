<header><div class="head"><div class="brand">Study<span>OS</span></div><h1>ChatGPT en el trabajo</h1><p>Aprende haciendo: problema → prompt → resultado → mejora.</p><div class="progress-wrap"><span id="progressText">Módulo 1 de 12</span><div class="progress"><i id="progress"></i></div></div></div></header>

<script>
const modules = [
{title:"ChatGPT como asistente de trabajo",intro:"El objetivo no es aprender trucos: es aprender a convertir una tarea real en un encargo claro para que ChatGPT pueda ayudarte.",objective:"Convertir una tarea vaga en una instrucción útil y reutilizable.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>ChatGPT funciona mejor como un colaborador al que das contexto y supervisas, no como un buscador al que lanzas preguntas aisladas. En el trabajo, su valor está en transformar información en borradores, estructuras, alternativas y primeras versiones que después revisas.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>Una petición eficaz suele responder a cinco preguntas: ¿qué está pasando?, ¿qué quiero conseguir?, ¿qué papel debe asumir la IA?, ¿cómo quiero el resultado? y ¿qué límites debe respetar? Cuanto más importante sea la tarea, más conviene explicitar estas condiciones.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>También es útil separar <b>generación</b> y <b>evaluación</b>. Primero puedes pedir una propuesta; después pedir una crítica de esa propuesta. Este segundo paso suele descubrir omisiones, ambigüedades y riesgos que no aparecen en la primera respuesta.</p></div>",sections:[
["1. Encargar una tarea, no pedir una cosa","«Hazme un email» deja demasiadas decisiones abiertas. Explica qué está pasando, qué quieres conseguir y para quién es el resultado."],
["2. Las 4 piezas","Contexto + tarea + formato + criterios. No siempre necesitas las cuatro, pero juntas forman una excelente base para trabajar."],
["3. Trabajar por iteraciones","Primera versión → detectas qué no funciona → das una instrucción concreta → revisas → versión final. No necesitas acertar a la primera."]
],example:["ANTES","Hazme un email para un cliente.","DESPUÉS","Trabajo en una pequeña empresa. Un pedido se retrasará dos días por un problema logístico. Redacta un email para el cliente. Tono profesional, cercano y transparente. Máximo 130 palabras. No culpes a terceros ni inventes información."],prompt:"Actúa como mi asistente de trabajo.\nContexto: [qué está pasando]\nObjetivo: [qué necesito conseguir]\nTarea: [qué quieres que hagas]\nFormato: [email / tabla / lista / esquema]\nCriterios: [tono, extensión y restricciones]",tip:"La claridad del encargo importa más que utilizar palabras mágicas.",question:"¿Qué combinación describe mejor una petición de trabajo útil?",options:["Contexto + tarea + formato + criterios","Una pregunta de una sola palabra","Pedir siempre una respuesta muy larga"],answer:0},
{title:"Emails y mensajes profesionales",intro:"ChatGPT puede ayudarte a redactar desde cero, mejorar un borrador y adaptar el mismo mensaje a distintos destinatarios.",objective:"Escribir comunicaciones claras sin cambiar los hechos.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>Hay tres usos diferentes que conviene distinguir: <b>generar</b> un mensaje desde cero, <b>transformar</b> un borrador que ya tienes y <b>adaptar</b> un mismo contenido a diferentes personas o canales. Saber cuál de los tres necesitas hace que el prompt sea mucho más preciso.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>El tono profesional no significa escribir de forma fría o excesivamente formal. Un buen mensaje suele tener propósito claro, contexto suficiente, petición o siguiente paso explícito y una longitud proporcional al asunto. Puedes pedir a ChatGPT que revise precisamente esos elementos.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>Una regla importante es no utilizar la IA para ocultar incertidumbre. Si no conoces una fecha, un precio o una condición, es mejor indicarlo que pedir que rellene el hueco. La IA debe mejorar la comunicación de los hechos, no fabricar hechos más convincentes.</p></div>",sections:[
["1. Redactar desde los hechos","Dale la información real y especifica qué no puede inventar. Tú decides si el resultado representa correctamente lo que quieres comunicar."],
["2. Mejorar sin cambiar el significado","Pide claridad, estructura, tono o concisión y añade «mantén exactamente los hechos»."],
["3. Adaptar el mensaje","Puedes crear una versión formal, cercana, corta para Teams/Slack o un asunto de email manteniendo el contenido base."]
],example:["BORRADOR","Hola Marta, al final no podremos tener lo de la semana que viene. Ya te avisaré.","VERSIÓN PROFESIONAL","Hola Marta,\n\nQuería avisarte de que finalmente no podremos tener preparado el material para la próxima semana. Te confirmaré la nueva fecha en cuanto la tengamos.\n\nDisculpa las molestias y gracias por la comprensión."],prompt:"Reescribe este mensaje para que sea profesional, claro y cordial.\nDestinatario: [cliente / compañero / responsable]\nObjetivo: [qué quiero conseguir]\nTono: [formal / cercano / diplomático]\nMantén exactamente los hechos y no inventes información.\n\nTexto:\n[pega aquí tu borrador]",tip:"Antes de enviar, comprueba destinatario, fechas, cantidades, nombres y compromisos.",question:"¿Qué instrucción ayuda a evitar que una reescritura cambie el contenido?",options:["Mantén exactamente los hechos y no inventes información","Hazlo más impresionante","Añade detalles para que parezca más profesional"],answer:0},
{title:"Crear y mejorar documentos",intro:"Los documentos largos son más manejables si separas planificación, redacción y revisión.",objective:"Pasar de ideas desordenadas a una estructura y después a un documento revisable.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>Crear un documento profesional es un proceso, no una única petición. Una secuencia habitual es: <b>definir objetivo → crear estructura → aportar información → redactar → revisar → adaptar al lector</b>. ChatGPT puede ayudarte en cada fase, pero no necesariamente debe hacerlas todas de una vez.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>El índice es especialmente importante porque determina qué entra y qué queda fuera. Antes de redactar, comprueba si el orden de las secciones responde a la pregunta del lector. Después, trabaja por bloques para mantener control sobre los datos y evitar que un error inicial se propague por todo el documento.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>En la revisión puedes pedir diferentes pasadas: una para claridad, otra para coherencia y otra para detectar afirmaciones que necesitan comprobación. Separar las revisiones suele ser más útil que pedir simplemente «mejora este documento».</p></div>",sections:[
["1. Empieza por el índice","Para un informe o propuesta importante, pide primero una estructura. Es más fácil corregir un índice que rehacer páginas enteras."],
["2. Redacta por bloques","Trabaja sección por sección y mantén un estilo coherente."],
["3. Usa la IA como revisor","Puede buscar repeticiones, contradicciones, frases ambiguas o información que falta."]
],prompt:"Crea una estructura para un documento sobre [tema].\nPúblico: [quién lo leerá]\nObjetivo: [qué debe conseguir]\nExtensión: [aproximada]\nIncluye secciones, objetivo de cada sección e información que falta.",tip:"Texto bien escrito no significa texto correcto. Los documentos importantes necesitan revisión humana.",question:"¿Por qué conviene crear primero una estructura?",options:["Porque permite corregir el enfoque antes de redactar todo","Porque así no hace falta revisar el documento","Porque ChatGPT decide qué información es verdadera"],answer:0},
{title:"Resumir reuniones, textos y documentos",intro:"Un buen resumen conserva lo importante para la decisión o acción que viene después.",objective:"Convertir información extensa en decisiones, acciones, responsables y próximos pasos.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>Resumir significa seleccionar información según un propósito. Un resumen ejecutivo, un acta de reunión y un resumen para un compañero no tienen la misma estructura aunque partan del mismo texto.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>Una técnica especialmente útil es convertir el resumen en <b>información accionable</b>: qué se decidió, qué queda pendiente, quién hace qué y para cuándo. Esto reduce el riesgo de que una reunión termine en un texto que nadie utiliza.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>Hay que distinguir entre información explícita e inferencias. Si el documento dice que una persona hará una tarea el viernes, puedes registrarlo. Si solo parece probable que sea responsable, no debes convertir esa interpretación en un hecho.</p></div>",sections:[
["1. Define para qué necesitas el resumen","Un director puede necesitar conclusiones; un compañero ausente puede necesitar contexto y tareas."],
["2. Extrae acciones","Separa decisiones, tareas, responsables, fechas y asuntos pendientes."],
["3. No inventes","Si algo no aparece en la fuente, indícalo como «no indicado»."]
],prompt:"Resume este contenido para una persona que no estuvo presente.\nSepara:\n1. Decisiones\n2. Tareas\n3. Responsables, si aparecen\n4. Fechas o plazos\n5. Asuntos pendientes\n\nNo inventes información. Si un dato no aparece, escribe «no indicado».\n\nContenido:\n[pega aquí]",example:["RESUMEN FLOJO","La reunión trató varios temas y se acordaron algunas acciones.","RESUMEN ÚTIL","DECISIONES: Se mantiene la fecha de lanzamiento.\nTAREAS: Preparar materiales de venta.\nRESPONSABLE: Laura.\nPLAZO: viernes.\nPENDIENTE: Confirmar presupuesto."],tip:"Conserva la fuente original. El resumen ayuda a trabajar, pero no sustituye la fuente.",question:"¿Qué hace especialmente útil un resumen de reunión?",options:["Separar decisiones, tareas, responsables y fechas","Hacerlo lo más largo posible","Eliminar fechas y responsables"],answer:0},
{title:"Organizar tareas y prioridades",intro:"El problema no suele ser escribir veinte pendientes: es decidir qué merece atención primero y cómo encajarlo en el tiempo disponible.",objective:"Convertir una lista caótica en un plan realista sin delegar el criterio final.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>Priorizar no consiste simplemente en ordenar una lista. Normalmente intervienen urgencia, impacto, esfuerzo, dependencia y coste de retrasar una tarea. Puedes pedir a ChatGPT que utilice estos criterios, pero primero debes definir cuáles importan en tu contexto.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>Una planificación útil también tiene en cuenta la capacidad real. Si dispones de cuatro horas, no sirve de nada crear un plan de ocho. Indicar reuniones, interrupciones y tareas que requieren concentración permite construir bloques más realistas.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>Puedes utilizar la IA como una segunda opinión: primero haces tu propia priorización y después le pides que busque puntos ciegos o alternativas. Así evitas convertir una recomendación automática en una decisión que debería depender de tu contexto profesional.</p></div>",sections:[
["1. Dale restricciones reales","Indica tiempo disponible, fechas límite y dependencias."],
["2. Detecta dependencias","No puedes enviar un informe antes de revisar los datos. Hacer visibles estas relaciones evita planes imposibles."],
["3. Valida la prioridad","ChatGPT puede proponer una clasificación, pero tú conoces el contexto real y validas la decisión."]
],prompt:"Estas son mis tareas:\n[lista]\n\nTengo [X horas] disponibles.\nFechas límite: [fechas]\nRestricciones: [reuniones y dependencias]\n\nOrdénalas por impacto y urgencia. Identifica dependencias y propón bloques de trabajo realistas.",tip:"Una buena planificación también decide qué NO hacer todavía.",question:"¿Quién debe validar la prioridad final?",options:["La persona responsable, usando el contexto real","ChatGPT automáticamente","El orden en que aparezcan las tareas"],answer:0},
{title:"Preparar reuniones y presentaciones",intro:"La IA puede ayudarte antes de una reunión a ordenar objetivos, preparar preguntas, anticipar objeciones y estructurar una presentación.",objective:"Llegar con propósito claro, preguntas preparadas y próximos pasos.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>Una reunión eficaz empieza antes de entrar en la sala. Hay que saber qué decisión, información o acuerdo se busca. A partir de ahí puedes construir una agenda que distribuya el tiempo según la importancia de cada punto.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>ChatGPT puede actuar como simulador. Puedes pedirle que adopte el papel de un cliente exigente, un responsable financiero o un compañero que discrepa y que formule objeciones. El objetivo no es adivinar exactamente qué ocurrirá, sino ampliar tu preparación.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>En presentaciones conviene trabajar de arriba abajo: primero el mensaje principal, después los argumentos que lo sostienen y finalmente los detalles. Las diapositivas son un medio; si no puedes explicar en una frase qué quieres que el público recuerde, todavía falta definir el mensaje.</p></div>",sections:[
["1. Define el resultado deseado","Una reunión sin objetivo puede terminar sin ninguna decisión. Define qué quieres conseguir."],
["2. Anticipa preguntas","Pide a ChatGPT que adopte la perspectiva de un cliente, responsable o compañero y formule preguntas difíciles."],
["3. Presentaciones: primero el mensaje","Antes de pedir diapositivas, define qué quieres que el público recuerde o decida."]
],prompt:"Voy a reunirme con [persona/equipo] sobre [tema].\nObjetivo: [objetivo]\nContexto: [información]\n\nPrepárame una agenda, 7 preguntas importantes, 5 posibles objeciones, información que debería llevar y una propuesta de cierre.",tip:"La preparación sirve para pensar mejor, no para sustituir tu criterio.",question:"¿Qué deberías definir antes de pedir una agenda?",options:["El objetivo que quieres conseguir","El número exacto de diapositivas","Una respuesta que ChatGPT deba imponer"],answer:0},
{title:"Analizar información y tomar decisiones",intro:"ChatGPT puede ayudarte a comparar alternativas y encontrar puntos ciegos, pero una tabla bonita no convierte datos incompletos en una decisión correcta.",objective:"Comparar alternativas y separar hechos de interpretaciones.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>Una decisión bien estructurada separa <b>datos, criterios y juicio</b>. Los datos describen la situación; los criterios indican qué valoras; el juicio determina qué alternativa prefieres dadas esas condiciones.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>Una de las mejores formas de utilizar ChatGPT es pedirle que desafíe tu primera hipótesis. Puedes solicitar argumentos en contra, riesgos ocultos, información faltante y escenarios en los que tu opción favorita dejaría de ser la mejor.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>Ten cuidado con las puntuaciones automáticas. Si asignas números a criterios subjetivos, el resultado puede parecer matemáticamente preciso sin serlo. La tabla sirve para hacer explícito el razonamiento, no para crear una falsa sensación de objetividad.</p></div>",sections:[
["1. Define criterios","Decide qué importa: coste, tiempo, riesgo, calidad, impacto u otros criterios."],
["2. Busca argumentos en contra","Pide razones por las que tu primera opción podría ser mala. Ayuda a detectar sesgos."],
["3. Separa hechos e inferencias","Distingue lo respaldado por información de las hipótesis o interpretaciones."]
],prompt:"Compara estas opciones: [A, B, C].\nCriterios: [criterios]\nInformación disponible: [datos]\n\nCrea una tabla con ventajas, inconvenientes, riesgos y preguntas pendientes. Separa hechos de interpretaciones. No inventes datos.",tip:"Para decisiones de alto impacto, la IA es apoyo. Contrasta los datos y consulta a la persona responsable.",question:"¿Qué mejora una comparación entre alternativas?",options:["Definir previamente los criterios de decisión","Pedir que elija una opción sin contexto","Usar solo argumentos a favor de nuestra opción favorita"],answer:0},
{title:"Trabajar con archivos y datos",intro:"La pregunta importante no es solo si ChatGPT puede leer un archivo, sino qué quieres averiguar con él.",objective:"Formular preguntas útiles sobre datos y comprobar las conclusiones.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>Cuando trabajas con un archivo, empieza por formular una pregunta concreta. «Analiza estos datos» puede producir una respuesta genérica; «identifica los tres cambios más importantes respecto al mes anterior y señala qué filas los explican» define una tarea comprobable.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>Hay dos niveles de resultado: <b>observación</b> e <b>interpretación</b>. Que las ventas bajen un 12 % es una observación si los datos lo muestran. Decir que la causa es una campaña publicitaria es una interpretación que necesita información adicional.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>Además de pedir conclusiones, pide trazabilidad: qué datos sustentan cada hallazgo, qué supuestos se han utilizado y qué información falta. Esto hace que el resultado sea mucho más fácil de auditar.</p></div>",sections:[
["1. Empieza por una pregunta","En lugar de «analiza este Excel», define si buscas tendencias, errores, valores atípicos o comparaciones."],
["2. Pide una salida verificable","Tablas, filas afectadas y explicaciones concretas suelen ser más fáciles de revisar."],
["3. Protege la información","Revisa las políticas de tu empresa y no compartas credenciales ni información que no estés autorizado a compartir."]
],prompt:"Analiza la información proporcionada.\nObjetivo: [qué quiero averiguar]\n\nIdentifica tendencias, valores atípicos y posibles errores. Presenta los hallazgos en una tabla. Diferencia hechos de interpretaciones e indica qué conclusiones NO pueden extraerse. No inventes datos.",tip:"Un resultado numérico convincente sigue necesitando comprobación.",question:"¿Qué debes hacer con una conclusión importante obtenida de un archivo?",options:["Comprobarla contra los datos y la fuente original","Aceptarla porque parece profesional","Eliminar el archivo original"],answer:0},

{title:"Privacidad, errores y uso responsable",intro:"Usar ChatGPT profesionalmente también significa saber qué información no introducir y cuándo verificar una respuesta.",objective:"Utilizar IA sin bajar los estándares profesionales.",theory:"<div class=\"theory\"><div class=\"theory-label\">TEORÍA · 1</div><p>El principal riesgo no es solo que ChatGPT se equivoque. También existe el riesgo de introducir información que no deberías compartir, generar una decisión basada en datos incompletos o aceptar una respuesta sin saber de dónde procede.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 2</div><p>Piensa en tres niveles de revisión. <b>Bajo riesgo:</b> estilo, lluvia de ideas o borradores. <b>Riesgo medio:</b> información que afecta a clientes, operaciones o decisiones internas. <b>Alto riesgo:</b> legal, financiero, médico, seguridad, credenciales o decisiones con consecuencias importantes. A medida que sube el riesgo, aumenta la necesidad de verificación y supervisión.</p></div><div class=\"theory\"><div class=\"theory-label\">TEORÍA · 3</div><p>También debes conocer las normas de tu organización. Que una herramienta permita técnicamente subir un documento no significa que tengas autorización para hacerlo. Las políticas internas y la confidencialidad profesional tienen prioridad.</p></div>",sections:[

let current=0;
const completed=new Set();
const menu=document.getElementById("menu");
const content=document.getElementById("content");
const progress=document.getElementById("progress");
const progressText=document.getElementById("progressText");

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});
}
function renderMenu(){
 menu.innerHTML=modules.map(function(m,i){
  return '<button class="module '+(i===current?'active':'')+'" onclick="showModule('+i+')"><small>MÓDULO '+String(i+1).padStart(2,"0")+(completed.has(i)?" · ✓ COMPLETADO":"")+'</small>'+escapeHtml(m.title)+'</button>';
 }).join("");
}
function renderSections(m){
 return m.sections.map(function(s){return '<div class="lesson"><strong>'+escapeHtml(s[0])+'</strong><p>'+s[1]+'</p></div>';}).join("");
}
function showModule(i){
 current=Math.max(0,Math.min(modules.length-1,i));
 const m=modules[current];
 renderMenu();
 let html='<div class="tag">MÓDULO '+String(current+1).padStart(2,"0")+' · '+(current===11?"RETO FINAL":"LECCIÓN")+'</div>';
 html+='<h2>'+escapeHtml(m.title)+'</h2>';
 html+='<p class="intro">'+m.intro+'</p>';
 html+='<div class="objective"><strong>🎯 Objetivo:</strong> '+m.objective+'</div>';
 if(m.theory) html+=m.theory;\n html+=renderSections(m);
 if(m.example){
  html+='<div class="example"><div class="label">'+escapeHtml(m.example[0])+'</div><div class="body before">'+escapeHtml(m.example[1])+'</div><div class="label">'+escapeHtml(m.example[2])+'</div><div class="body after">'+escapeHtml(m.example[3])+'</div></div>';
 }
 html+='<h3>Prompt listo para usar</h3><div class="prompt"><button class="copy" onclick="copyPrompt()">Copiar</button><span id="promptText">'+escapeHtml(m.prompt)+'</span></div>';
 if(m.tip) html+='<div class="'+(m.warning?"warning":"tip")+'">💡 <strong>'+ (m.warning?"Importante":"Idea clave")+':</strong> '+escapeHtml(m.tip)+'</div>';
 if(m.check) html+='<h3>Checklist del reto</h3><div class="checklist">'+m.check.map(function(x){return '<div class="check">☐ '+escapeHtml(x)+'</div>';}).join("")+'</div>';
 html+='<div class="quiz"><div class="quiz-title">🧠 Comprueba lo aprendido</div><p>'+escapeHtml(m.question)+'</p>';
 html+=m.options.map(function(x,j){return '<button class="option" onclick="answer('+j+',this)">'+escapeHtml(x)+'</button>';}).join("");
 html+='<div class="result" id="result"></div></div>';
 html+='<div class="nav"><button class="prev" onclick="showModule('+(current-1)+')">← '+(current?"Anterior":"Inicio")+'</button><button class="next" onclick="showModule('+(current+1)+')">'+(current===modules.length-1?"Volver al reto":"Siguiente →")+'</button></div>';
 if(completed.has(current)) html+='<div class="complete">✓ Módulo completado. Puedes volver cuando quieras para consultar sus prompts.</div>';
 content.innerHTML=html;
 updateProgress();
 window.scrollTo({top:0,behavior:"smooth"});
}
function answer(index,button){
 const m=modules[current];
 const result=document.getElementById("result");
 document.querySelectorAll(".option").forEach(function(x){x.classList.remove("correct","wrong");});
 if(index===m.answer){
  button.classList.add("correct");
  result.textContent="✓ Correcto. Has identificado la idea principal.";
  result.style.color="var(--ok)";
  completed.add(current);
  renderMenu();
  updateProgress();
 }else{
  button.classList.add("wrong");
  result.textContent="No exactamente. Revisa el contenido del módulo y vuelve a intentarlo.";
  result.style.color="var(--warn)";
 }
}
function updateProgress(){
 progress.style.width=((current+1)/modules.length*100)+"%";
 progressText.textContent="Módulo "+(current+1)+" de "+modules.length+(completed.size?" · "+completed.size+" completados":"");
}
async function copyPrompt(){
 const text=document.getElementById("promptText").textContent;
 try{await navigator.clipboard.writeText(text);document.querySelector(".copy").textContent="✓ Copiado";setTimeout(function(){document.querySelector(".copy").textContent="Copiar";},1400);}
 catch(e){alert("No se pudo copiar automáticamente. Selecciona el texto y cópialo.");}
}
showModule(0);
</script>
