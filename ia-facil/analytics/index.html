<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA fácil · Analytics</title>
<style>
:root{--ink:#17312b;--muted:#64736e;--bg:#f5f7f4;--card:#fff;--line:#dce4df;--green:#1f6b54;--green2:#15533f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:24px}.eyebrow{font-size:13px;font-weight:800;text-transform:uppercase;color:var(--green);letter-spacing:.08em}.title{font-size:38px;line-height:1.05;margin:5px 0}.muted{color:var(--muted)}
.login{max-width:430px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 50px #17312b12}.login h1{margin-top:0}.input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:8px 0 12px}.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{background:#e8efe9;color:var(--green2)}.error{color:#a33;margin-top:12px;font-size:14px}
.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.metric{font-size:34px;font-weight:900;margin-top:6px}.metric-label{font-size:14px;color:var(--muted)}.section{margin-top:18px}.section h2{font-size:21px;margin:0 0 12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--muted);font-weight:700}.bar-row{display:grid;grid-template-columns:130px 1fr 45px;gap:10px;align-items:center;margin:10px 0;font-size:14px}.bar{height:10px;background:#e8eee9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px 14px;background:#eef5ef;border:1px solid #d3e3d6;border-radius:12px;font-size:14px;margin-bottom:16px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:start;flex-direction:column}}@media(max-width:520px){.wrap{padding:22px 14px}.title{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app" class="hidden">
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">IA fácil · Dashboard</div><div class="title">Rendimiento de la landing</div><div class="muted">Datos anónimos recogidos por Cloudflare Worker + KV.</div></div>
    <div class="actions"><button id="refresh" class="btn">Actualizar</button></div>
  </div>
  <div id="notice" class="notice hidden"></div>
  <section class="grid">
    <div class="card"><div class="metric-label">Visitas</div><div id="visits" class="metric">—</div></div>
    <div class="card"><div class="metric-label">Clics CTA</div><div id="cta" class="metric">—</div></div>
    <div class="card"><div class="metric-label">Clics Stripe</div><div id="stripe" class="metric">—</div></div>
    <div class="card"><div class="metric-label">Conversión a CTA</div><div id="conversion" class="metric">—</div></div>
  </section>
  <section class="section card"><h2>Visitas por día</h2><div id="days"></div></section>
  <section class="section card"><h2>Origen / UTM</h2><div id="sources"></div></section>
  <section class="section card"><h2>Dispositivo</h2><div id="devices"></div></section>
  <section class="section card"><h2>Últimos eventos</h2><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Evento</th><th>Origen</th><th>Dispositivo</th><th>País</th></tr></thead><tbody id="events"></tbody></table></div></section>
</div>
</main>
<script>
const WORKER_URL="https://cursoia.studyos-oficial-spain.workers.dev";
const $=id=>document.getElementById(id);
async function load(){
  try{
    const r=await fetch(WORKER_URL+"/stats");
    if(!r.ok) throw new Error("No se pudieron cargar los datos");
    const d=await r.json();
    render(d);
  }catch(e){
    $("notice").textContent=e.message;
    $("notice").classList.remove("hidden");
  }
}
function render(d){
  $("visits").textContent=d.totals.visits;
  $("cta").textContent=d.totals.cta;
  $("stripe").textContent=d.totals.stripe;
  $("conversion").textContent=d.totals.visits?((d.totals.cta/d.totals.visits)*100).toFixed(1)+"%":"0%";
  renderBars("days",d.byDay);
  renderBars("sources",d.bySource);
  renderBars("devices",d.byDevice);
  $("events").innerHTML=d.recent.map(e=>"<tr><td>"+fmt(e.ts)+"</td><td>"+esc(e.event)+"</td><td>"+esc(e.utm_source||"direct")+"</td><td>"+esc(e.device||"—")+"</td><td>"+esc(e.country||"—")+"</td></tr>").join("");
}
function renderBars(id,obj){
  const entries=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);
  const max=entries[0]?.[1]||1;
  $(id).innerHTML=entries.length?entries.slice(0,15).map(([k,v])=>'<div class="bar-row"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+Math.max(3,v/max*100)+'%"></i></div><b>'+v+'</b></div>').join(""):'<span class="muted">Sin datos todavía.</span>';
}
function fmt(ts){return new Date(ts).toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
$("refresh").onclick=load;
load();
</script>
</body>
</html>
