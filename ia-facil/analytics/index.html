<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>IA fácil · Analítica</title><style>body{font:15px system-ui,sans-serif;max-width:1000px;margin:auto;padding:20px;background:#faf7f2;color:#222}.card{background:#fff;padding:16px;border-radius:12px;margin:10px 0;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k{font-size:25px;font-weight:800}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #eee;text-align:left}td:last-child,th:last-child{text-align:right}input,select,button{padding:9px;border-radius:8px;border:1px solid #ddd;font:inherit}button{background:#e0763b;color:#fff;border:0}</style></head><body><h1>IA fácil · Analítica anónima</h1><p>Sin cookies ni identificadores. Los visitantes son únicos por día.</p><div class="card"><input id="tk" type="password" placeholder="Token"><select id="dy"><option>7</option><option selected>30</option><option>90</option></select><button id="go">Ver datos</button><span id="msg"></span></div><div id="out"></div><script>
const API="https://cursoia.studyos-oficial-spain.workers.dev/stats", $=id=>document.getElementById(id);
function build(rows){const m={};for(const r of rows){const k=[r.s,r.kind,r.key].join("|");m[k]??={total:0,uniq:0};m[k].total+=r.total;m[k].uniq+=r.uniq}const g=(s,k,p)=>m[[s,k,p].join("|")]||{total:0,uniq:0};const list=(s,k,p="")=>Object.keys(m).filter(x=>x.startsWith([s,k,p].join("|"))).map(x=>{const z=x.split("|");return{key:z.slice(2).join("|").slice(p.length),...m[x]}}).sort((a,b)=>b.uniq-a.uniq);return{g,list}}
function table(head,rows){return "<div class=card><table><tr>"+head.map(x=>"<th>"+x+"</th>").join("")+"</tr>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")+"</table></div>"}
function render(rows){const {g,list}=build(rows),V=g("landing","pv","/").uniq,b=g("landing","click","/|buy_stripe").uniq,scroll=n=>g("landing","scroll","/|"+n).uniq;
let html="<h2>Landing</h2><div class=grid>"+[["Visitantes",V],["Visitas",g("landing","pv","/").total],["Clics Stripe",b],["Conversión Stripe",V?(b/V*100).toFixed(1)+"%":"–"]].map(x=>"<div class=card><div class=k>"+x[1]+"</div>"+x[0]+"</div>").join("")+"</div>";
html+="<h2>Scroll</h2>"+table(["Profundidad","Visitantes","%"],[25,50,75,90,100].map(n=>[n+"%",scroll(n),V?(scroll(n)/V*100).toFixed(1)+"%":"–"]));
html+="<h2>Clics</h2>"+table(["Elemento","Únicos","Totales"],list("landing","click","/|").map(x=>[x.key,x.uniq,x.total]));
html+="<h2>Origen</h2>"+table(["Origen","Únicos"],list("landing","src").map(x=>[x.key,x.uniq]));
html+="<h2>Dispositivo</h2>"+table(["Dispositivo","Únicos"],list("landing","dev").map(x=>[x.key,x.uniq]));
html+="<h2>País</h2>"+table(["País","Únicos"],list("landing","cty").map(x=>[x.key,x.uniq]));
const pages=list("course","pv"),CV=g("course","pv","/curso/").uniq;
html+="<h2>Curso</h2><div class=grid>"+[["Visitantes portal",CV],["Páginas vistas",pages.reduce((a,x)=>a+x.total,0)],["Módulos completados",rows.filter(r=>r.s==="course"&&r.kind==="done").reduce((a,x)=>a+x.uniq,0)]].map(x=>"<div class=card><div class=k>"+x[1]+"</div>"+x[0]+"</div>").join("")+"</div>";
html+=table(["Página","Únicos","50%","100%"],pages.map(x=>{const s=x.key,m=(s.match(/modulo-(\d+)/)||[])[1],u=n=>g("course","scroll",s+"|"+n).uniq;return[s,x.uniq,x.uniq?(u(50)/x.uniq*100).toFixed(1)+"%":"–",x.uniq?(u(100)/x.uniq*100).toFixed(1)+"%":"–"]}));
$("out").innerHTML=html}
$("go").onclick=async()=>{try{$("msg").textContent=" Cargando…";const r=await fetch(API+"?days="+$("dy").value,{headers:{Authorization:"Bearer "+$("tk").value.trim()},cache:"no-store"});if(r.status===401)throw Error("Token incorrecto");if(!r.ok)throw Error("Error "+r.status);render((await r.json()).rows||[]);$("msg").textContent=""}catch(e){$("msg").textContent=" "+e.message}};
</script></body></html>
