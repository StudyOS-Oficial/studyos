<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>IA fácil · Analítica</title>
<style>
:root{--bg:#faf7f2;--fg:#222;--card:#fff;--mut:#777;--ac:#e0763b;--ln:#eee}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--card:#212121;--mut:#999;--ln:#333}}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:16px;max-width:900px;margin:auto}
h1{font-size:20px}h2{font-size:17px;margin:26px 0 8px}.card{background:var(--card);border-radius:12px;padding:14px;margin:8px 0;overflow-x:auto}
.kpi{display:flex;flex-wrap:wrap;gap:8px}.kpi div{flex:1 1 130px;background:var(--card);border-radius:12px;padding:12px}.kpi b{font-size:24px;display:block}
.mut{color:var(--mut);font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}td.n,th.n{text-align:right}
.bar{background:var(--ln);border-radius:6px;height:10px;min-width:80px}.bar i{display:block;height:10px;border-radius:6px;background:var(--ac)}
input,select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--ln)}button{background:var(--ac);color:#fff;border:0;cursor:pointer}
</style></head><body>
<h1>IA fácil · Analítica anónima</h1>
<p class="mut">Sin cookies ni identificadores. Los «visitantes» son únicos por día (un mismo visitante en dos días cuenta dos veces).</p>
<div class="card"><input id="tk" type="password" placeholder="Token de acceso"> <select id="dy"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option></select> <label for="dt" class="mut">Día concreto:</label> <input id="dt" type="date" aria-label="Filtrar por día concreto"> <button id="go">Ver</button> <span id="msg" class="mut"></span></div>
<div id="out"></div>
<script>
const API="https://cursoia.studyos-oficial-spain.workers.dev/stats", $=id=>document.getElementById(id);
function el(t,txt,cls){const e=document.createElement(t);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function build(rows){
  const M={};for(const r of rows){const k=r.s+"|"+r.kind+"|"+r.key,m=M[k]||(M[k]={total:0,uniq:0});m.total+=r.total;m.uniq+=r.uniq}
  const g=(s,kind,key)=>M[s+"|"+kind+"|"+key]||{total:0,uniq:0};
  const list=(s,kind,pre)=>Object.keys(M).filter(k=>k.startsWith(s+"|"+kind+"|"+pre)).map(k=>({key:k.split("|").slice(2).join("|").slice(pre.length),...M[k]})).sort((a,b)=>b.uniq-a.uniq);
  return {g,list}
}
const pct=(a,b)=>b?Math.round(a/b*1000)/10+"%":"–";
function bar(p){const d=el("div",null,"bar"),i=el("i");i.style.width=Math.min(100,p||0)+"%";d.append(i);return d}
function table(head,rows){const t=el("table"),h=el("tr");head.forEach((x,i)=>h.append(el("th",x,i?"n":"")));t.append(h);
  rows.forEach(r=>{const tr=el("tr");r.forEach((c,i)=>{const td=el("td",null,i?"n":"");c instanceof Node?td.append(c):td.textContent=c;tr.append(td)});t.append(tr)});
  const c=el("div",null,"card");c.append(t);return c}
function kpis(items){const k=el("div",null,"kpi");items.forEach(([l,v])=>{const d=el("div");d.append(el("b",v),el("span",l,"mut"));k.append(d)});return k}
function render(rows){
  const {g,list}=build(rows),o=$("out");o.textContent="";
  const V=g("landing","pv","/").uniq, buy=g("landing","click","/|buy_stripe");
  o.append(el("h2","Landing"),kpis([["Visitantes",V],["Visitas a la página",g("landing","pv","/").total],["Clics a Stripe (únicos)",buy.uniq],["% que clica a Stripe",pct(buy.uniq,V)]]));
  o.append(el("h2","¿Hasta dónde llegan?"),table(["Scroll","Visitantes","% del total",""],[25,50,75,90,100].map(n=>{const u=g("landing","scroll","/|"+n).uniq;return[n+"%",u,pct(u,V),bar(V?u/V*100:0)]})));
  const sec=list("landing","section","/|");if(sec.length)o.append(el("h2","Secciones vistas"),table(["Sección","Visitantes","% del total",""],sec.map(r=>[r.key,r.uniq,pct(r.uniq,V),bar(V?r.uniq/V*100:0)])));
  o.append(el("h2","¿Dónde clican?"),table(["Elemento","Visitantes","Clics totales"],list("landing","click","/|").map(r=>[r.key,r.uniq,r.total])));
  const dim=(t,kind)=>{const x=list("landing",kind,"");return table([t,"Visitantes"],x.map(r=>[r.key,r.uniq]))};
  o.append(el("h2","Origen, dispositivo y país"),dim("Origen","src"),dim("Dispositivo","dev"),dim("País","cty"));
  const pages=list("course","pv","");const CV=g("course","pv","/curso/").uniq;
  o.append(el("h2","Curso"),kpis([["Visitantes al portal",CV],["Páginas vistas",pages.reduce((a,r)=>a+r.total,0)],["Módulos completados",rows.filter(r=>r.s==="course"&&r.kind==="done").reduce((a,r)=>a+r.uniq,0)]]));
  o.append(table(["Página","Visitantes","Llega al 50%","Llega al 100%","Marca completado","Termina quiz"],pages.map(r=>{
    const m=(r.key.match(/modulo-(\d+)/)||[])[1],f=(k,kd)=>g("course",kd,r.key+"|"+k).uniq;
    return[r.key,r.uniq,pct(f(50,"scroll"),r.uniq),pct(f(100,"scroll"),r.uniq),m?pct(f("m"+m,"done"),r.uniq):"–",m?pct(f("m"+m,"quiz"),r.uniq):"–"]})));
  const mc=list("course","click","/curso/|module_");if(mc.length)o.append(el("h2","Interés por módulo (clics desde el portal)"),table(["Módulo","Visitantes","Clics"],mc.map(r=>["Módulo "+r.key,r.uniq,r.total])));
}
$("go").onclick=async()=>{
  $("msg").textContent="Cargando…";
  try{
    const day=$("dt").value,days=day?365:$("dy").value;
    const r=await fetch(API+"?days="+days,{headers:{Authorization:"Bearer "+$("tk").value.trim()},cache:"no-store"});
    if(r.status===401)throw Error("Token incorrecto");if(!r.ok){let m="Error "+r.status;try{m=(await r.json()).error||m}catch(e){}throw Error(m)}
    const rows=(await r.json()).rows||[];
    render(day?rows.filter(row=>row.day===day):rows);$("msg").textContent="";
  }catch(e){$("msg").textContent=e.message}
};
$("dt").onchange=()=>{if($("dt").value)$("dy").value="30"};
</script></body></html>
