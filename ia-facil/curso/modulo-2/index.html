(function () {
  const nativeOpen = document.open.bind(document);
  const nativeWrite = document.write.bind(document);

  function patchModule2(html) {
    if (typeof html !== "string" || !html.includes('Resultado:') || !html.includes('function q(')) return html;

    html = html.replace(
      "score+'/3 correctas.'",
      "score+'/5 correctas.'"
    );
    html = html.replace(
      "a<3",
      "a<5"
    );

    const extraQuestions = `
<p><b>4. ¿Qué puedes hacer si la respuesta de ChatGPT no es exactamente lo que necesitas?</b></p>
<button onclick="q(this,false)">A. Darla por buena sin cambiar nada.</button>
<button onclick="q(this,true)">B. Aclarar o reformular lo que necesitas.</button>
<button onclick="q(this,false)">C. Cerrar siempre la conversación.</button>

<p><b>5. ¿Por qué es útil indicar el formato en el que quieres una respuesta?</b></p>
<button onclick="q(this,false)">A. Para que ChatGPT use palabras más complicadas.</button>
<button onclick="q(this,false)">B. Para limitar siempre la respuesta a una frase.</button>
<button onclick="q(this,true)">C. Para recibir la información de la forma que te resulte más útil.</button>
`;

    const resultMarker = '<div id="result"';
    if (!html.includes(resultMarker)) return html;
    return html.replace(resultMarker, extraQuestions + resultMarker);
  }

  function patchedWrite(html) {
    return nativeWrite(patchModule2(html));
  }

  document.write = patchedWrite;
  document.open = function () {
    const result = nativeOpen.apply(document, arguments);
    document.write = patchedWrite;
    return result;
  };
})();
