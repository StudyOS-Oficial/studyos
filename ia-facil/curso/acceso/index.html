<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · IA fácil</title><style>

</script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://wquosenmzaezycdrpujz.supabase.co","sb_publishable_hCZNRQgU9Rco89U7FUr12w_pp91r7uM");
let mode="login";
const $=id=>document.getElementById(id), msg=$("msg");
$("loginTab").onclick=()=>{mode="login";$("loginTab").classList.add("active");$("signupTab").classList.remove("active");$("submit").textContent="Entrar";$("intro").textContent="Inicia sesión con tu cuenta de IA fácil."};
$("signupTab").onclick=()=>{mode="signup";$("signupTab").classList.add("active");$("loginTab").classList.remove("active");$("submit").textContent="Crear cuenta";$("intro").textContent="Usa el mismo email que utilizaste al comprar el curso."};
function show(t){msg.hidden=false;msg.textContent=t}
$("form").onsubmit=async e=>{e.preventDefault();msg.hidden=true;const email=$("email").value.trim().toLowerCase(),password=$("password").value;
let r;
if(mode==="signup") r=await supabase.auth.signUp({email,password});
else r=await supabase.auth.signInWithPassword({email,password});
if(r.error){show(r.error.message);return}
if(mode==="signup" && !r.data.session){show("Cuenta creada. Revisa tu email para confirmar la cuenta y después inicia sesión.");return}
const claim=await supabase.functions.invoke("claim-ia-facil-access");
if(claim.error || !claim.data?.has_access){show("No encontramos una compra asociada a este email. Usa el mismo email que utilizaste en Stripe.");await supabase.auth.signOut();return}
location.href="../";
};
const params=new URLSearchParams(location.search);if(params.get("denied"))show("Necesitas una compra activa para entrar al curso.");
</script></body></html>
