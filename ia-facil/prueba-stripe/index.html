<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba Stripe Embedded Checkout · IA fácil</title>
<script src="https://js.stripe.com/v3/"></script>
<style>
:root{--navy:#0b1f4d;--blue:#0a6cff;--sky:#f0f6ff;--ink:#14213d;--mut:#51607d;--line:#dbe6f7}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--sky)}
.wrap{max-width:900px;margin:auto;padding:24px}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 0}
.logo{font-weight:900;font-size:24px;color:var(--navy)}
.badge{display:inline-block;background:#fff2c7;color:#725600;font-weight:800;border-radius:999px;padding:7px 12px;font-size:13px;margin:24px 0 12px}
h1{font-size:clamp(34px,7vw,52px);line-height:1.05;color:var(--navy);margin:0 0 12px}
p{color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 35px #0b1f4d12;margin-top:28px}
.price{font-size:42px;font-weight:900;color:var(--navy);margin:8px 0}
#checkout{min-height:420px}
.status{padding:14px;border-radius:12px;background:#eef5ff;color:#234b87;margin-bottom:16px}
.error{background:#fff0f0;color:#9b2020}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">StudyOS · IA fácil</div></div></header>
<main class="wrap">
<div class="badge">PÁGINA DE PRUEBA · NO ES LA LANDING PRINCIPAL</div>
<h1>Prueba de Stripe Checkout integrado</h1>
<p>Esta página sirve únicamente para comprobar cómo queda el pago de IA fácil sin salir de la landing.</p>
<div class="card">
<div class="price">9,90 €</div>
<p>Curso IA fácil · pago único</p>
<div id="status" class="status">Cargando el checkout…</div>
<div id="checkout"></div>
</div>
</main>
<script>
(async function(){
  const status=document.getElementById('status');
  try{
    const stripe=Stripe('pk_live_REPLACE_WITH_PUBLISHABLE_KEY');
    const fetchClientSecret=async()=>{
      const res=await fetch('https://studyos-omega-five.vercel.app/api/create-checkout-session',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({source:'ia-facil-stripe-test'})
      });
      if(!res.ok) throw new Error('No se pudo crear la sesión de Stripe ('+res.status+').');
      const data=await res.json();
      if(!data.clientSecret) throw new Error('El servidor no devolvió clientSecret.');
      return data.clientSecret;
    };
    const checkout=await stripe.initEmbeddedCheckout({fetchClientSecret});
    status.textContent='Checkout listo. Esta es la prueba del pago integrado:';
    checkout.mount('#checkout');
  }catch(e){
    status.className='status error';
    status.textContent='La prueba todavía no está conectada al servidor seguro de Stripe: '+e.message;
  }
})();
</script>
</body>
</html>
