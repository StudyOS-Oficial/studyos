name: Temporary course source recovery
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover source HTML from git history
        run: |
          mkdir -p /tmp/course-source
          git show 092b340cb19ec73199bada975ddb8b8b32ac1071 > /tmp/course-source/modulo-11.html
          git show cb7d79fc1943342363ad4fa2b9e978205cdf761d > /tmp/course-source/modulo-12.html
          git show 091dc99a94ff5a837f96d77e4a363d829ab05328 > /tmp/course-source/modulo-13.html
          cp ia-facil/curso/lock.json /tmp/course-source/lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: ia-facil-source-recovery
          path: /tmp/course-source/
          retention-days: 1

# second event to activate this temporary recovery workflow
