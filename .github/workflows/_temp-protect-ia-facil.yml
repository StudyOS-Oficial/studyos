name: TEMP protect IA Facil

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  protect:
    if: github.event.head_commit.message == 'TEMP-PROTECT-IA-FACIL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Encrypt course HTML
        env:
          PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA5YXR480uLI9Hx05tBuAW
            O2WsphGEi/Fwbqd9oy2M52+o1Jda/UHDuSh5zqKiCZJ3cbe3Puuza2stGaNtXQzA
            iKTBEtBwOGPmAMvOr9/6JDZD2J5vMh/x+1DjGEHEit6yidRzYd5Js7fzAOazM3jo
            Q5gAsxMpsSxhEO4LnsLgGNwWo5lMlaHIuJpmlZ1htYvT/SvdSJ/CAcQrITSYVELN
            m6GUDVG/dXpv+/Tl0XjtdPiJiTAe4VZbOrzp3s5VtyzWVPMj6GzBudq+A/9rYOlD
            0DdB4QgJRxttnOYYHt4MkQ8pz3OvO/yTkrBU+aeRDjiSJ2kYdhPHqBQBOszJzOLq
            eQIDAQAB
            -----END PUBLIC KEY-----
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const root=path.join(process.cwd(),'ia-facil','curso');
          const enc=new TextEncoder();
          const b64=b=>Buffer.from(b).toString('base64');
          const files=[];
          function walk(dir,rel=''){
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              if(e.name==='acceso'||e.name==='analytics'||e.name==='node_modules') continue;
              const abs=path.join(dir,e.name), r=path.join(rel,e.name);
              if(e.isDirectory()) walk(abs,r);
              else if(/\\.html$/i.test(e.name)) files.push([abs,r.replaceAll('\\\\','/')]);
            }
          }
          walk(root);
          const master=crypto.randomBytes(32);
          const key=crypto.createSecretKey(master);
          const shell=(iv,ct,depth)=>'<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>IA fácil · Acceso</title></head><body><noscript>Activa JavaScript para entrar al curso.</noscript><script id="payload" type="application/json">'+JSON.stringify({iv:b64(iv),ct:b64(ct)})+'<\\/script><script src="'+(depth?'../'.repeat(depth):'./')+'lock.js"><\\/script></body></html>';
          const lockjs="/* IA fácil · puerta de acceso. Descifra la página en el navegador con la contraseña del curso. */\n(function () {\n  \"use strict\";\n  var S = document.currentScript, BASE = new URL(\".\", S.src).href, KS = \"iafacil-lock-v1\", sub = crypto.subtle;\n  var pay = JSON.parse(document.getElementById(\"payload\").textContent), meta;\n  var d = function (s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };\n  var e = function (a) { var s = \"\"; for (var i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s); };\n  async function open(W) {\n    var kraw = await sub.decrypt({ name: \"AES-GCM\", iv: d(meta.iv) }, W, d(meta.wrapped));\n    var K = await sub.importKey(\"raw\", kraw, \"AES-GCM\", false, [\"decrypt\"]);\n    return new TextDecoder().decode(await sub.decrypt({ name: \"AES-GCM\", iv: d(pay.iv) }, K, d(pay.ct)));\n  }\n  function render(html) { document.open(); document.write(html); document.close(); }\n  async function fromPw(pw) {\n    var b = await sub.importKey(\"raw\", new TextEncoder().encode(pw), \"PBKDF2\", false, [\"deriveKey\"]);\n    return sub.deriveKey({ name: \"PBKDF2\", salt: d(meta.salt), iterations: meta.iter, hash: \"SHA-256\" }, b, { name: \"AES-GCM\", length: 256 }, true, [\"decrypt\"]);\n  }\n  var css = \"body{margin:0;font:20px/1.5 system-ui,sans-serif;background:#faf7f2;color:#222;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}\" +\n    \"@media(prefers-color-scheme:dark){body{background:#161616;color:#eee}.g{background:#222!important}}\" +\n    \".g{box-sizing:border-box;max-width:440px;width:100%;background:#fff;border-radius:18px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.1)}h1{margin:0 0 8px;font-size:30px}\" +\n    \"input[type=password],input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:14px;border:2px solid #bbb;border-radius:12px;margin:10px 0}\" +\n    \"button{width:100%;font:inherit;font-weight:700;padding:16px;border:0;border-radius:12px;background:#e0763b;color:#fff;cursor:pointer;margin-top:6px}\" +\n    \"label{display:block;margin:4px 0}#er{color:#c0392b;font-weight:700;min-height:1.5em}.s{font-size:16px;opacity:.8}\";\n  function gate() {\n    var st = document.createElement(\"style\"); st.textContent = css; document.head.appendChild(st);\n    document.body.innerHTML = '<form class=\"g\" id=\"f\"><h1>🔐 Tu acceso personal a IA Fácil</h1><p>Te hemos generado esta <b>contraseña unipersonal</b> para acceder al curso.</p><p><b>Guarda esta contraseña en un lugar seguro. La necesitarás para acceder al curso.</b></p><input id=\"pw\" type=\"password\" autocomplete=\"current-password\" aria-label=\"Contraseña\" autofocus><label><input type=\"checkbox\" id=\"sh\"> Ver la contraseña</label><button id=\"ok\" type=\"submit\">Entrar al curso</button><p id=\"er\" role=\"alert\"></p><p class=\"s\">Una vez introducida en tu dispositivo, <b>no tendrás que volver a escribirla</b>.</p><p class=\"s\" id=\"ct\"></p></form>';\n    var em = meta && meta.contact; if (em && /^[^\\s<>\"']+@[^\\s<>\"']+$/.test(em)) {\n      var a = document.createElement(\"a\"); a.href = \"mailto:\" + em; a.textContent = em;\n      document.getElementById(\"ct\").append(\"¿Problemas para entrar? Escríbenos a \", a);\n    }\n    var pw = document.getElementById(\"pw\"), er = document.getElementById(\"er\"), ok = document.getElementById(\"ok\");\n    document.getElementById(\"sh\").onchange = function () { pw.type = this.checked ? \"text\" : \"password\"; };\n    document.getElementById(\"f\").onsubmit = async function (ev) {\n      ev.preventDefault(); er.textContent = \"\"; var v = pw.value.trim(); if (!v) { er.textContent = \"Escribe la contraseña.\"; return; }\n      ok.disabled = true; ok.textContent = \"Comprobando…\";\n      try {\n        var W = await fromPw(v), html;\n        try { html = await open(W); } catch (x) { er.textContent = \"Contraseña incorrecta. Revisa las mayúsculas y que no haya espacios.\"; ok.disabled = false; ok.textContent = \"Entrar al curso\"; return; }\n        try { localStorage.setItem(KS, e(new Uint8Array(await sub.exportKey(\"raw\", W)))); } catch (x) {}\n        render(html);\n      } catch (x) { er.textContent = \"Ha habido un problema. Inténtalo de nuevo.\"; ok.disabled = false; ok.textContent = \"Entrar al curso\"; }\n    };\n  }\n  (async function () {\n    try { var r = await fetch(BASE + \"lock.json\", { cache: \"no-store\" }); if (!r.ok) throw 0; meta = await r.json(); }\n    catch (x) { document.body.textContent = \"No se ha podido cargar el curso. Revisa tu conexión e inténtalo de nuevo.\"; return; }\n    var s = null; try { s = localStorage.getItem(KS); } catch (x) {}\n    if (s) {\n      try { render(await open(await sub.importKey(\"raw\", d(s), \"AES-GCM\", false, [\"decrypt\"]))); return; }\n      catch (x) { try { localStorage.removeItem(KS); } catch (y) {} }\n    }\n    gate();\n  })();\n})();";
          for(const [abs,rel] of files){
            const html=fs.readFileSync(abs);
            const iv=crypto.randomBytes(12);
            const c=crypto.createCipheriv('aes-256-gcm',master,iv);
            const ct=Buffer.concat([c.update(html),c.final(),c.getAuthTag()]);
            const depth=rel.split('/').length-1;
            fs.writeFileSync(abs,shell(iv,ct,depth));
          }
          fs.writeFileSync(path.join(root,'lock.js'),lockjs);
          const salt=crypto.randomBytes(16), iv=crypto.randomBytes(12), tempPw=crypto.randomBytes(24).toString('base64url');
          const dk=crypto.pbkdf2Sync(Buffer.from(tempPw),salt,600000,32,'sha256');
          const wiv=crypto.randomBytes(12);
          const wc=crypto.createCipheriv('aes-256-gcm',dk,wiv);
          const wrapped=Buffer.concat([wc.update(master),wc.final(),wc.getAuthTag()]);
          fs.writeFileSync(path.join(root,'lock.json'),JSON.stringify({v:1,salt:b64(salt),iter:600000,iv:b64(wiv),wrapped:b64(wrapped)}));
          const pub=process.env.PUBLIC_KEY;
          const sealed=crypto.publicEncrypt({key:pub,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},master);
          fs.writeFileSync(path.join(process.cwd(),'.tmp-master-key'),b64(sealed)+'\\n');
          require('child_process').execFileSync('git',['config','user.name','StudyOS']);
          require('child_process').execFileSync('git',['config','user.email','polgeligorriz@gmail.com']);
          require('child_process').execFileSync('git',['add','ia-facil/curso']);
          require('child_process').execFileSync('git',['add','.tmp-master-key']);
          require('child_process').execFileSync('git',['commit','-m','TEMP-PROTECTED-IA-FACIL']);
          require('child_process').execFileSync('git',['push']);
          console.log('Protected '+files.length+' HTML pages.');
          NODE
